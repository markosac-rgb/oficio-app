# Blueprint de Render. Los datos viven en Neon (PostgreSQL), no en un disco.
services:
  - type: web
    name: oficio
    runtime: docker
    plan: free
    branch: main
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: OFICIO_TRUST_ORIGIN
        value: "1"
