# Blueprint de Render. Los datos viven en Neon (PostgreSQL), no en un disco.
services:
  - type: web
    name: oficio
    runtime: docker
    plan: free
    branch: main
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: OFICIO_TRUST_ORIGIN
        value: "1"
      - key: OFICIO_PUBLIC_URL
        value: "https://oficio-app.onrender.com"
      - key: OFIXIO_COMMISSION_PCT
        value: "0"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_TEST_MODE
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
